site_name: Base de connaissances
site_description: Fiches, tutos et mémos d'administration systèmes et réseaux
site_author: Vincent
site_url: https://vincentfrag.github.io/Base-de-connaissances/
repo_url: https://github.com/VincentFrag/Base-de-connaissances
repo_name: VincentFrag/Base-de-connaissances

theme:
  name: material
  language: fr
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Passer en mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Passer en mode clair
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.path
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: fr
  - tags

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Accueil: index.md
  - Réseau:
      - reseau/index.md
      - Fondamentaux:
          - "Le modèle OSI et TCP/IP": reseau/concept-modele-osi-tcpip.md
          - "Adressage IP et masque": reseau/concept-adressage-ip.md
          - "Découper en sous-réseaux": reseau/tuto-sous-reseaux.md
      - DHCP et DNS:
          - "Comprendre": reseau/concept-dhcp-dns.md
          - "Mettre en pratique": reseau/tuto-dhcp-dns.md
      - VLAN:
          - "Comprendre": reseau/concept-vlan.md
          - "Mettre en pratique": reseau/tuto-creer-vlan.md
      - Accès distant:
          - "Comprendre SSH": reseau/concept-ssh.md
          - "SSH par le nom d'une VM": reseau/tuto-ssh-nom-vm.md
          - "SSH par rebond (réseau interne)": reseau/tuto-ssh-rebond.md
      - Dépannage:
          - "Diagnostiquer une connexion": reseau/tuto-diagnostic-connexion.md
          - "Mémo commandes réseau": reseau/memo-commandes-reseau.md
      - Pare-feu et NAT:
          - "Comprendre": reseau/concept-pare-feu-nat.md
          - "Mettre en pratique": reseau/tuto-pfsense-pare-feu-nat.md
      - S'entraîner:
          - "TP : PME multi-VLAN": reseau/tp-pme-multi-vlan.md
  - Système:
      - systeme/index.md
      - Virtualisation:
          - "Comprendre": systeme/concept-virtualisation.md
          - "Préparer un clone de VM": systeme/tuto-preparer-clone-vm.md
      - Comptes et droits Linux:
          - "Comprendre": systeme/concept-permissions-linux.md
          - "Mettre en pratique": systeme/tuto-permissions-linux.md
      - Active Directory:
          - "Comprendre": systeme/concept-active-directory.md
          - "Mettre en pratique": systeme/tuto-monter-ad-proxmox.md
  - Transverse:
      - transverse/index.md
      - Sauvegarde:
          - "Comprendre": transverse/concept-sauvegardes.md
          - "Mettre en pratique": transverse/tuto-proxmox-backup.md
