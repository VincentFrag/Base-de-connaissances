site_name: Base de connaissances
site_description: Fiches, tutos et mémos d'administration systèmes et réseaux
site_author: Vincent
site_url: https://vincentfrag.github.io/Base-de-connaissances/
repo_url: https://github.com/VincentFrag/Base-de-connaissances
repo_name: VincentFrag/Base-de-connaissances

theme:
  name: material
  language: fr
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Passer en mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Passer en mode clair
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

plugins:
  - search:
      lang: fr
  - tags

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Accueil: index.md
  - Réseau:
      - reseau/index.md
      - "🧠 Le modèle OSI et TCP/IP": reseau/concept-modele-osi-tcpip.md
      - "🧠 Adressage IP et masque": reseau/concept-adressage-ip.md
      - "🧠 DHCP et DNS": reseau/concept-dhcp-dns.md
      - "🛠️ Diagnostiquer une connexion": reseau/tuto-diagnostic-connexion.md
      - "📋 Mémo commandes réseau": reseau/memo-commandes-reseau.md
  - Système:
      - systeme/index.md
  - Transverse:
      - transverse/index.md
